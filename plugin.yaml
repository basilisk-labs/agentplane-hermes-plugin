name: agentplane
version: "0.2.1"
description: Hermes native worker-lane bridge for AgentPlane WorkOrders.
python_dependencies:
  - cryptography>=42
config_schema:
  approval_issuer:
    type: str
    default: hermes-dialog
    description: Trusted AgentPlane approval receipt issuer id.
  approval_subject:
    type: str
    default: owner
    description: Audited user subject for explicit owner approval actions.
  approval_ttl_minutes:
    type: int
    default: 10
    description: Short-lived approval receipt lifetime in minutes.
